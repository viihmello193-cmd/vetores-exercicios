<script>
    let vetorA = [];
    let soma = 0;
    for(let i=0; i<10; i++){
        vetorA[i] = parseInt(prompt("Entre com o "+(i+1)+"º número:"));
    }
    for(let i=0; i<10; i++){
        soma = soma + vetorA[i];
    }
    document.write("Vetor A: "+vetorA+"<br>");
    document.write("Soma: "+soma);
</script>
